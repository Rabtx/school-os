[package]
name = "school-os-rust"
version = "0.1.0"
edition = "2021"
description = "Rust app for school-os monorepo"
rust-version = "1.86"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
dotenvy = "0.15.7"
jsonwebtoken = "10.4.0"
uuid = { version = "1.23.1", features = ["v4"] }
bcrypt = "0.19.1"
sha2 = "0.10.9"
chrono = { version = "0.4.44", features = ["serde"] }
time = "0.3.47"
axum-extra = { version = "0.12.6", features = ["cookie"] }

[profile.release]
lto = true
codegen-units = 1
